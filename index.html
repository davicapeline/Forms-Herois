<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Formulários</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header>
            <h1>Academia de Heróis</h1>
            <p>Inscreva-se para participar da próxima missão.</p>
        </header>
        <main>
            <h2>Faça sua inscrição</h2>
            <form action="#" metod="get">
                <label for="heroi">Nome de herói:</label>
                <input id="heroi" name="heroi" type="text" />
                
                <label for="email">E-mail</label>
                <input id="email" name="email" type="text" />
                
                <label for="idade">Idade</label>
                <input id="idade" name="idade" type="number" />
                <label for="equipe">Escolha sua equipe</label>
                <select id="equipe" name="equipe">
                    <option>Vingadores</option>
                    <option>Liga da Justiça</option>
                    <option>X-Men</option>
                </select>

                <h2>Qual poder você prefere?</h2>
                <article class="botao">
                    <input id="voar" name="poder" type="radio" />
                    <label for="voar">Voar</label>
                </article>

                <article class="botao">
                     <input id="supervelocidade" name="poder" type="radio" />
                    <label for="supervelocidade">Supervelocidade</label>
                </article>

                <article class="botao">
                     <input id="supeforça" name="poder" type="radio" />
                    <label for="supeforça">Supeforça</label>
                </article>

                <article class="botao">
                    <input id="novidades" name="novidades" type="checkbox" />
                    <label for="novidades">Quero receber novas missões.</label>
                </article>
    
                <label for="descricao">Por quê você quer ser um herói?</label>
                <textarea id="descricao" name="descricao" rows="4"></textarea>
    
                <button type="submit">Enviar inscrição</button>
            </form>
        </main>
        <footer>
            <p>Prática de formulários HTML.</p>
        </footer>
    </body>
</html>
